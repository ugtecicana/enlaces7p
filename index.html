:root {
    --ugt-red: #e30613;
    --text: #111111;
    --soft: #444444;
    --bg: #f0f2f5;
    --border: #dddddd;
}

* { box-sizing: border-box; }

body {
    background-color: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 14px;
}

.container {
    background-color: #ffffff;
    width: 100%;
    max-width: 450px;
    padding: 0 0 26px 0;
    border-radius: 22px;
    box-shadow: 0 14px 30px rgba(0, 0, 0, 0.12);
    text-align: center;
    overflow: hidden;
    border-top: 8px solid var(--ugt-red);
}

.header-box {
    padding: 22px 18px 12px;
    display: flex;
    justify-content: center;
}

.logo-img {
    width: 90%;
    max-width: 380px;
}

h1 {
    color: var(--text);
    font-size: 28px;
    margin: 12px 20px 4px;
    letter-spacing: 0.5px;
}

.subtitle-strong {
    color: var(--text);
    font-size: 15px;
    font-weight: 600;
    margin: 0 24px 8px;
}

.subtitle {
    color: var(--soft);
    font-size: 15.5px;
    margin: 0 24px 24px;
}

.btn-list {
    padding: 0 20px;
    display: grid;
    gap: 12px;
}

.btn {
    display: flex;
    justify-content: center;
    background: #ffffff;
    color: var(--text);
    text-decoration: none;
    padding: 16px;
    border-radius: 16px;
    font-weight: 600;
    font-size: 16px;
    border: 1px solid var(--border);
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.btn:hover {
    transform: translateY(-2px) scale(1.01);
    box-shadow: 0 9px 18px rgba(0,0,0,0.1);
}

.btn:active {
    transform: scale(0.98);
}

.btn-inner {
    display: flex;
    align-items: center;
    min-width: 220px;
}

.btn svg {
    width: 24px;
    height: 24px;
    min-width: 24px;
    margin-right: 14px;
}

.whatsapp { border-left: 7px solid #25D366; background: #f0fff5; }
.telegram { border-left: 7px solid #0088cc; }
.instagram { border-left: 7px solid #E1306C; }
.facebook { border-left: 7px solid #1877F2; }
.email { border-left: 7px solid var(--ugt-red); }
.buzon { border-left: 7px solid #444; }

.footer {
    margin-top: 22px;
    font-size: 13px;
    color: #c40000;
    font-weight: 600;
}
</style>
